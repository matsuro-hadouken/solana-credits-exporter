[package]
name = "solana-credits-exporter"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Credits Exporter"
license = "MIT"
repository = "https://github.com/matsuro-hadouken/solana-credits-exporter"

[dependencies]
serde_json = "1.0"
solana-rpc-client = "=4.4.1"
solana-rpc-client-api = "=4.4.1"
solana-commitment-config = "=3.1.1"
solana-epoch-info = "=3.1.0"
prometheus = "0.13.4"
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.39.3", features = ["full"] }
